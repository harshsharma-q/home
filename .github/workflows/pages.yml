name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate static website
        run: |
          node scripts/validate_site.mjs
          node --check assets/content.js
          node --check assets/sheet-config.js
          node --check assets/publications.js
          node --check assets/site.js
          node --check assets/site-data.js
          node --check scripts/build_cv.mjs
      - name: Refresh publications from arXiv
        if: github.event_name != 'push'
        run: python3 scripts/update_arxiv.py
      - name: Commit refreshed publication data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/publications.js
          git diff --cached --quiet || git commit -m "Update publications from arXiv"
          git push || true
      - name: Build CV (assets/cv.pdf)
        continue-on-error: true
        run: node scripts/build_cv.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
