name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  # Daily at 03:17 UTC: rebuilds the CV from the latest Sheet data.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate static website
        run: |
          node scripts/validate_site.mjs
          node --check assets/content.js
          node --check assets/sheet-config.js
          node --check assets/publications.js
          node --check assets/site.js
          node --check assets/site-data.js
          node --check scripts/build_cv.mjs
      # arXiv is refreshed on manual runs and on the Monday scheduled run, so the
      # publication list (and its "Last updated" date) still changes at most weekly.
      - name: Decide whether to refresh arXiv
        id: arxiv
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; }; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh publications from arXiv
        if: steps.arxiv.outputs.refresh == 'true'
        run: python3 scripts/update_arxiv.py
      - name: Commit refreshed publication data
        if: steps.arxiv.outputs.refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/publications.js
          git diff --cached --quiet || git commit -m "Update publications from arXiv"
          git push || true
      - name: Build CV (assets/cv.pdf)
        continue-on-error: true
        run: node scripts/build_cv.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
